<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }} · {{ page.role | default: "Developer" }}</title>
  <meta name="description" content="{{ site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title | escape }} - {{ page.role | default: "Developer" }}">
  <meta property="og:description" content="Backend and automation engineer. Open to remote roles.">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:image" content="{{ "/assets/og-image.png" | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/profile.css" | relative_url }}">
</head>
<body>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap site-foot">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.title | escape }}</span>
    <span>
      <a href="{{ "/archive/" | relative_url }}">Blog archive</a>
    </span>
  </footer>
</body>
</html>
